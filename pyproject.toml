[project]
name = "apk-sbom-mvp"
version = "0.1.0"
description = "MVP for evidence-based SBOM recovery from compiled Android APKs."
requires-python = ">=3.12"
dependencies = [
  "androguard==4.1.3",
  "networkx==3.4.2",
  "requests==2.32.3",
  "packaging==24.2",
  "pydantic==2.10.6",
  "rich==13.9.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
]

[project.scripts]
apk-sbom = "apk_sbom.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

